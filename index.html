    function renderCategoriesView() {
      return renderCategoriesCardHtml();
    }

    function renderCashflowChart() {
      const ref = ui.cursorDate;
      const months = [];
      for (let i = 5; i >= 0; i--) {
        const dt = new Date(ref.getFullYear(), ref.getMonth() - i, 1);
        const start = new Date(dt.getFullYear(), dt.getMonth(), 1);
        const end = new Date(dt.getFullYear(), dt.getMonth() + 1, 0, 23, 59, 59, 999);
        const list = filterTransactions(start, end, ui.accountFilter);
        const inc = list.filter(t => t.type === 'income').reduce((s, t) => s + txBaseAmount(t), 0);
        const exp = list.filter(t => t.type === 'expense').reduce((s, t) => s + txBaseAmount(t), 0);
        months.push({
          label: dt.toLocaleDateString('ru-RU', { month: 'short' }).replace('.', ''),
          inc, exp
        });
      }
      const maxVal = Math.max(1000, ...months.flatMap(m => [m.inc, m.exp]));
      const W = 540, H = 190, padL = 12, padB = 26, chartH = H - padB - 10;
      const colW = (W - padL * 2) / months.length;

      const bars = months.map((m, idx) => {
        const x = padL + idx * colW + colW * 0.2;
        const bw = colW * 0.26;
        const hInc = (m.inc / maxVal) * chartH;
        const hExp = (m.exp / maxVal) * chartH;
        const yInc = chartH - hInc + 8;
        const yExp = chartH - hExp + 8;
        return `
          <g class="cf-group" data-label="${escapeHtml(m.label)}" data-inc="${formatMoney(m.inc)}" data-exp="${formatMoney(m.exp)}">
            <rect class="bar-rect" x="${x}" y="${yInc}" width="${bw}" height="${Math.max(2, hInc)}" rx="5" fill="var(--income)" />
            <rect class="bar-rect" x="${x + bw + 5}" y="${yExp}" width="${bw}" height="${Math.max(2, hExp)}" rx="5" fill="var(--expense)" />
            <text x="${x + bw + 2.5}" y="${H - 4}" text-anchor="middle" fill="var(--text-muted)" font-size="11.5" font-weight="600">${escapeHtml(m.label)}</text>
          </g>
        `;
      }).join('');

      const gridLines = [0.25, 0.5, 0.75, 1].map(r => {
        const y = chartH * (1 - r) + 8;
        return `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 4" />`;
      }).join('');

      return `<svg class="cashflow-svg" viewBox="0 0 ${W} ${H}">${gridLines}${bars}</svg>`;
    }

    function renderBudgetsMini() {
      const now = new Date();
      const mStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const mEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
      const monthTxs = filterTransactions(mStart, mEnd, 'all').filter(t => t.type === 'expense');

      const items = state.budgets.slice(0, 3).map(b => {
        const cat = state.categories.find(c => c.id === b.categoryId);
        if (!cat) return '';
        const limitBase = toBase(b.limit, b.currency || 'RUB');
        const spent = monthTxs.reduce((s, t) => {
          const matched = getTxCategoryEntries(t).filter(e => e.categoryId === b.categoryId);
          return s + matched.reduce((m, e) => m + e.baseAmount, 0);
        }, 0);
        const pct = Math.min(100, Math.round((spent / limitBase) * 100));
        const barColor = spent > limitBase ? 'var(--danger)' : (pct >= 80 ? 'var(--transfer)' : 'var(--accent)');
        return `
          <div style="margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;">
              <span style="display:flex;align-items:center;gap:8px;font-weight:700;">
                <span style="width:10px;height:10px;border-radius:50%;background:${cat.color}"></span>
                ${escapeHtml(cat.name)}
              </span>
              <span class="num money-val" style="font-weight:700;color:${spent > limitBase ? 'var(--danger)' : 'var(--text-secondary)'}">
                ${formatMoney(spent)} / ${formatMoney(limitBase)}
              </span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${pct}%;background:${barColor}"></div>
            </div>
          </div>
        `;
      }).join('');

      const goal = state.goals[0];
      const goalSavedBase = goal ? toBase(goal.saved, goal.currency || 'RUB') : 0;
      const goalTargetBase = goal ? toBase(goal.target, goal.currency || 'RUB') : 0;
      const goalHtml = goal ? `
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:12px;color:var(--text-muted);font-weight:700;">Ближайшая цель</div>
            <div style="font-size:14px;font-weight:800;margin-top:2px;">${escapeHtml(goal.name)}</div>
          </div>
          <div style="text-align:right;">
            <div class="num money-val" style="font-weight:800;color:var(--accent-text)">${formatMoney(goalSavedBase)} / ${formatMoney(goalTargetBase)}</div>
            <div style="font-size:11.5px;color:var(--text-muted);">${Math.min(100, Math.round((goalSavedBase / Math.max(1, goalTargetBase)) * 100))}% накоплено</div>
          </div>
        </div>` : '';

      return (items || '<div class="empty-state" style="padding:18px;">Лимиты пока не заданы</div>') + goalHtml;
    }

    function renderTxItem(tx) {
      const cat = state.categories.find(c => c.id === tx.categoryId);
      const acc = state.accounts.find(a => a.id === tx.accountId);
      const toAcc = tx.toAccountId ? state.accounts.find(a => a.id === tx.toAccountId) : null;

      let iconBg = cat?.color || '#8C7A5B';
      let iconName = cat?.icon || 'tag';
      let title = cat?.name || 'Операция';
      let accLine = acc?.name || '';
      let sign = tx.type === 'income' ? '+' : (tx.type === 'expense' ? '−' : '');
      const hasSplits = Array.isArray(tx.splits) && tx.splits.length > 1;

      if (hasSplits) {
        const splitCats = tx.splits.map(s => state.categories.find(c => c.id === s.categoryId)?.name).filter(Boolean);
        title = splitCats.slice(0, 2).join(' + ') + (splitCats.length > 2 ? ` (+${splitCats.length - 2})` : '');
      }

      if (tx.type === 'transfer') {
        iconBg = '#C47F17';
        iconName = 'repeat';
        title = `Перевод: ${acc?.name || '?'} → ${toAcc?.name || '?'}`;
        accLine = tx.toAmount && acc?.currency !== toAcc?.currency
          ? `Зачислено ${formatMoney(tx.toAmount, toAcc?.currency)}`
          : 'Между счетами';
      }

      const cur = acc?.currency || state.settings.baseCurrency;
      const showApprox = cur !== state.settings.baseCurrency;
      const approxText = showApprox ? ` · ≈ ${formatMoney(txBaseAmount(tx))}` : '';
      const dateStr = new Date(tx.date + 'T00:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      const timeStr = tx.createdAt && tx.createdAt > 1000000000000
        ? ' · ' + new Date(tx.createdAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
        : '';
      const tagsHtml = (tx.tags && tx.tags.length)
        ? `<div class="tag-row">${tx.tags.map(tg => `<span class="tag-pill">#${escapeHtml(tg)}</span>`).join('')}</div>`
        : '';

      return `
        <div class="tx-item" data-edit-tx="${tx.id}">
          <div class="cat-icon-badge" style="background:${iconBg}">${iconSvg(iconName, 16)}</div>
          <div class="tx-meta">
            <div class="tx-title">
              <span>${escapeHtml(title)}</span>
              ${hasSplits ? `<span class="tag-pill" style="font-size:10px;padding:1px 6px;">✂ ${tx.splits.length}</span>` : ''}
            </div>
            <div class="tx-sub">${tx.note ? escapeHtml(tx.note) + ' · ' : ''}${dateStr}${timeStr}</div>
            ${tagsHtml}
          </div>
          <div class="tx-amount-col">
            <div class="tx-amount ${tx.type} num money-val">${sign}${formatMoney(tx.amount, cur)}</div>
            <div class="tx-account-tag">${escapeHtml(accLine)}${escapeHtml(approxText)}</div>
          </div>
          <button class="tx-del-btn" data-del-tx="${tx.id}" title="Удалить операцию">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          </button>
        </div>
      `;
    }

    /* ---------- TRANSACTIONS VIEW ---------- */
    function renderTransactionsListInner() {
      const { start, end } = getPeriodRange();
      let list = filterTransactions(start, end);

      if (ui.txTypeFilter !== 'all') list = list.filter(t => t.type === ui.txTypeFilter);
      if (ui.txCatFilter !== 'all') list = list.filter(t => txMatchesCategory(t, ui.txCatFilter));
      if (ui.txTagFilter !== 'all') list = list.filter(t => (t.tags || []).includes(ui.txTagFilter));
      if (ui.txSearch.trim()) {
        const q = ui.txSearch.trim().toLowerCase().replace(/^#/, '');
        list = list.filter(t => {
          const catNames = getTxCategoryEntries(t).map(e => state.categories.find(c => c.id === e.categoryId)?.name || '').join(' ');
          return (t.note || '').toLowerCase().includes(q)
            || catNames.toLowerCase().includes(q)
            || String(t.amount).includes(q)
            || (t.tags || []).some(tg => tg.toLowerCase().includes(q));
        });
      }

      const tagSummaryHtml = ui.txTagFilter !== 'all' ? (() => {
        const expSum = list.filter(t => t.type === 'expense').reduce((s, t) => s + txBaseAmount(t), 0);
        const incSum = list.filter(t => t.type === 'income').reduce((s, t) => s + txBaseAmount(t), 0);
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;background:var(--accent-soft);margin-bottom:14px;font-size:13px;">
            <span>По тегу <strong>#${escapeHtml(ui.txTagFilter)}</strong> (${list.length} опер.)</span>
            <span class="num money-val" style="font-weight:800;">
              ${expSum > 0 ? `Расход: ${formatMoney(expSum)}` : ''}
              ${expSum > 0 && incSum > 0 ? ' · ' : ''}
              ${incSum > 0 ? `Доход: +${formatMoney(incSum)}` : ''}
            </span>
          </div>
        `;
      })() : '';

      const groups = {};
      for (const tx of list) {
        if (!groups[tx.date]) groups[tx.date] = [];
        groups[tx.date].push(tx);
      }

      const todayStr = isoDate(new Date());
      const yest = new Date(); yest.setDate(yest.getDate() - 1);
      const yestStr = isoDate(yest);

      const groupsHtml = Object.entries(groups).map(([date, items]) => {
        let dayLabel = new Date(date + 'T00:00:00').toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
        if (date === todayStr) dayLabel = 'Сегодня';
        else if (date === yestStr) dayLabel = 'Вчера';
        const dayTotal = items.reduce((s, t) => {
          if (t.type === 'income') return s + txBaseAmount(t);
          if (t.type === 'expense') return s - txBaseAmount(t);
          return s;
        }, 0);
        return `
          <div class="tx-group">
            <div class="tx-date-header">
              <span>${dayLabel}</span>
              <span class="num money-val">${formatMoney(dayTotal, state.settings.baseCurrency, true)}</span>
            </div>
            <div class="tx-list">${items.map(renderTxItem).join('')}</div>
          </div>
        `;
      }).join('');

      return tagSummaryHtml + (groupsHtml || `<div class="empty-state">По выбранным фильтрам операций не найдено.</div>`);
    }

      const allTags = getAllTags();

          <button class="tag-pill clickable ${ui.txTagFilter==='all'?'active':''}" data-filter-tag="all">Все теги</button>
          ${allTags.map(tg => `<button class="tag-pill clickable ${ui.txTagFilter===tg?'active':''}" data-filter-tag="${escapeHtml(tg)}">#${escapeHtml(tg)}</button>`).join('')}
        </div>` : '';

        <div class="card" style="margin-bottom:18px;">
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;">
            <input type="text" class="input" id="txSearchInput" placeholder="Поиск по заметке, категории, сумме или #тегу..." value="${escapeHtml(ui.txSearch)}" style="flex:1;min-width:200px;" />
            <select class="select-pill" id="txTypeSelect">
              <option value="all" ${ui.txTypeFilter==='all'?'selected':''}>Все типы</option>
              <option value="expense" ${ui.txTypeFilter==='expense'?'selected':''}>Только расходы</option>
              <option value="income" ${ui.txTypeFilter==='income'?'selected':''}>Только доходы</option>
              <option value="transfer" ${ui.txTypeFilter==='transfer'?'selected':''}>Переводы</option>

            <select class="select-pill" id="txCatSelect">
              <option value="all">Все категории</option>
              ${state.categories.map(c => `<option value="${c.id}" ${ui.txCatFilter===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
            </select>
            <button class="btn btn-subtle" id="btnExportCsv">Экспорт CSV</button>

          ${renderTransactionsListInner()}

    /* ---------- BUDGETS & GOALS VIEW ---------- */
    function renderBudgetsView() {
      const now = new Date();
      const mStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const mEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
      const monthTxs = filterTransactions(mStart, mEnd, 'all').filter(t => t.type === 'expense');
      const daysLeft = Math.max(1, new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate() + 1);

      const budgetsHtml = state.budgets.map(b => {
        const cat = state.categories.find(c => c.id === b.categoryId);
        if (!cat) return '';
        const limitBase = toBase(b.limit, b.currency || 'RUB');
        const spent = monthTxs.reduce((s, t) => {
          const matched = getTxCategoryEntries(t).filter(e => e.categoryId === b.categoryId);
          return s + matched.reduce((m, e) => m + e.baseAmount, 0);
        }, 0);
        const pct = Math.min(100, Math.round((spent / Math.max(1, limitBase)) * 100));
        const rem = limitBase - spent;
        const barColor = spent > limitBase ? 'var(--danger)' : (pct >= 80 ? 'var(--transfer)' : 'var(--accent)');
        const statusText = rem >= 0
          ? `Осталось ${formatMoney(rem)} (~${formatMoney(rem / daysLeft)}/день)`
          : `Превышен на ${formatMoney(Math.abs(rem))}`;
        return `
          <div class="budget-card">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="cat-icon-badge" style="background:${cat.color}">${iconSvg(cat.icon, 16)}</div>
                <div>
                  <div style="font-weight:800;font-size:14.5px;">${escapeHtml(cat.name)}</div>
                  <div style="font-size:12px;color:var(--text-muted);">${pct}% использовано</div>
                </div>
              </div>
              <button class="icon-btn" data-del-budget="${b.id}" title="Удалить лимит" style="width:30px;height:30px;">✕</button>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${pct}%;background:${barColor}"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:12.5px;">
              <span class="money-val" style="color:${rem < 0 ? 'var(--danger)' : 'var(--text-secondary)'};font-weight:600;">${statusText}</span>
              <span class="num money-val" style="font-weight:800;">${formatMoney(limitBase)}</span>
            </div>
          </div>
        `;
      }).join('');

      const goalsHtml = state.goals.map(g => {
        const savedBase = toBase(g.saved, g.currency || 'RUB');
        const targetBase = toBase(g.target, g.currency || 'RUB');
        const pct = Math.min(100, Math.round((savedBase / Math.max(1, targetBase)) * 100));
        return `
          <div class="budget-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <div style="font-weight:800;font-size:15px;">${escapeHtml(g.name)}</div>
                <div style="font-size:12px;color:var(--text-muted);">Срок: ${g.deadline ? new Date(g.deadline + 'T00:00:00').toLocaleDateString('ru-RU') : 'без срока'}</div>
              </div>
              <button class="icon-btn" data-del-goal="${g.id}" title="Удалить цель" style="width:30px;height:30px;">✕</button>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${pct}%;background:${g.color}"></div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="num money-val" style="font-weight:800;">${formatMoney(savedBase)} <span style="color:var(--text-muted);font-weight:600;">из ${formatMoney(targetBase)} (${pct}%)</span></span>
              <button class="btn btn-primary" data-topup-goal="${g.id}" style="padding:6px 12px;font-size:12px;">+ Пополнить</button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="grid-2">
          <div class="card">
            <div class="card-header">
              <div>
                <h3 class="card-title">Месячные лимиты</h3>
                <p class="card-subtitle">Помогают не выходить за рамки плана</p>
              </div>
              <button class="btn btn-primary" id="btnAddBudget">+ Лимит</button>
            </div>
            <div style="display:flex;flex-direction:column;gap:12px;">
              ${budgetsHtml || '<div class="empty-state">Добавьте первый бюджет на категорию (например, Продукты или Кафе).</div>'}
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div>
                <h3 class="card-title">Финансовые цели</h3>
                <p class="card-subtitle">Копилки на мечты и подушку безопасности</p>
              </div>
              <button class="btn btn-primary" id="btnAddGoal">+ Цель</button>
            </div>
            <div style="display:flex;flex-direction:column;gap:12px;">
              ${goalsHtml || '<div class="empty-state">Создайте цель накопления и отслеживайте прогресс!</div>'}
            </div>
          </div>
        </div>
      `;
    }

    /* ---------- DEBTS VIEW ---------- */
    function renderDebtsView() {
      const debts = state.debts || [];
      const activeDebts = debts.filter(d => !d.settled);
      const settledDebts = debts.filter(d => d.settled);
      const today = isoDate(new Date());

      const lentTotal = activeDebts.filter(d => d.direction === 'lent')
        .reduce((s, d) => s + toBase(d.remaining, d.currency || state.settings.baseCurrency), 0);
      const borrowedTotal = activeDebts.filter(d => d.direction === 'borrowed')
        .reduce((s, d) => s + toBase(d.remaining, d.currency || state.settings.baseCurrency), 0);
      const netDebt = lentTotal - borrowedTotal;

      const renderDebtCard = (d) => {
        const acc = state.accounts.find(a => a.id === d.accountId);
        const cur = d.currency || acc?.currency || state.settings.baseCurrency;
        const pct = Math.min(100, Math.round(((d.amount - d.remaining) / Math.max(1, d.amount)) * 100));
        const isOverdue = !d.settled && d.dueDate && d.dueDate < today;
        const dirBadge = d.direction === 'lent'
          ? `<span class="trend-chip good">Мне должны</span>`
          : `<span class="trend-chip bad">Я должен</span>`;
        return `
          <div class="budget-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
              <div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  <span style="font-weight:800;font-size:15px;">${escapeHtml(d.person)}</span>
                  ${d.settled ? `<span class="trend-chip neutral">Погашено</span>` : dirBadge}
                  ${isOverdue ? `<span class="trend-chip bad">Просрочен</span>` : ''}
                </div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:3px;">
                  ${d.note ? escapeHtml(d.note) + ' · ' : ''}
                  ${d.dueDate ? 'Срок: ' + new Date(d.dueDate + 'T00:00:00').toLocaleDateString('ru-RU') : 'Без срока'}
                </div>
              </div>
              <button class="icon-btn" data-del-debt="${d.id}" title="Удалить запись" style="width:30px;height:30px;">✕</button>
            </div>
            ${!d.settled && d.remaining < d.amount ? `

    /* ==========================================================================
       8. MODALS (QUICK ADD CALCULATOR, ACCOUNTS, BUDGETS, GOALS, CATEGORIES)
       ========================================================================== */
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalBox = document.getElementById('modalBox');

    function closeModal() {
      modalBackdrop.classList.remove('open');
      window.removeEventListener('keydown', calcKeyHandler);
    }

    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    // Quick Transaction / Calculator State
    let txModalState = null;

    function openTxModal({ type = 'expense', categoryId = null, editTx = null } = {}) {
      const defAcc = state.accounts[0]?.id || '';
      const secondAcc = state.accounts[1]?.id || defAcc;
      const catsForType = state.categories.filter(c => c.type === (type === 'transfer' ? 'expense' : type));
      const hasSplits = Array.isArray(editTx?.splits) && editTx.splits.length > 1;

      txModalState = {
        editId: editTx?.id || null,
        createdAt: editTx?.createdAt || null,
        type: editTx?.type || type,
        expr: editTx ? String(editTx.amount) : '0',
        accountId: editTx?.accountId || defAcc,
        toAccountId: editTx?.toAccountId || secondAcc,
        toAmount: editTx?.toAmount ? String(editTx.toAmount) : '',
        categoryId: editTx?.categoryId || categoryId || catsForType[0]?.id || '',
        splitMode: hasSplits,
        splits: hasSplits ? editTx.splits.map(s => ({ categoryId: s.categoryId, amount: String(s.amount) })) : [],
        date: editTx?.date || isoDate(new Date()),
        note: editTx?.note || '',
        tags: Array.isArray(editTx?.tags) ? [...editTx.tags] : [],
        makeRecurring: false,
        recFreq: 'monthly',
        newCatOpen: false,
        newCatName: '',
        newCatIcon: 'tag',
        newCatColor: PALETTE[0],
        newCatSplitIdx: null
      };
      renderTxModal();
      modalBackdrop.classList.add('open');
      window.addEventListener('keydown', calcKeyHandler);
    }

    function evalCalcExpr(expr) {
      const sanitized = String(expr).replace(/×/g, '*').replace(/÷/g, '/').replace(/[^0-9+\-*/.]/g, '');
      if (!sanitized) return 0;
      try {
        // Safe arithmetic evaluation via Function on strictly numeric/operator string
        const trimmed = sanitized.replace(/[+\-*/.]+$/, '');
        if (!trimmed) return 0;
        const res = Function(`"use strict"; return (${trimmed})`)();
        return Number.isFinite(res) && res >= 0 ? Math.round(res * 100) / 100 : 0;
      } catch { return 0; }
    }

    function calcInput(key) {
      if (!txModalState) return;
      let s = txModalState.expr;
      if (key === 'C') s = '0';
      else if (key === '⌫') s = s.length > 1 ? s.slice(0, -1) : '0';
      else if (key === '=') s = String(evalCalcExpr(s));
      else if (['+','-','×','÷'].includes(key)) {
        if (['+','-','×','÷'].includes(s.slice(-1))) s = s.slice(0, -1) + key;
        else s += key;
      } else if (key === '.') {
        const lastNum = s.split(/[+\-×÷]/).pop();
        if (!lastNum.includes('.')) s += (lastNum === '' ? '0.' : '.');
      } else {
        s = (s === '0') ? key : s + key;
      }
      txModalState.expr = s;
      updateCalcDisplay();
    }

    function calcKeyHandler(e) {
      if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
        if (e.key === 'Escape') closeModal();
        return;
      }
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); calcInput(e.key); }
      else if (e.key === '+') { e.preventDefault(); calcInput('+'); }
      else if (e.key === '-') { e.preventDefault(); calcInput('-'); }
      else if (e.key === '*') { e.preventDefault(); calcInput('×'); }
      else if (e.key === '/') { e.preventDefault(); calcInput('÷'); }
      else if (e.key === '.' || e.key === ',') { e.preventDefault(); calcInput('.'); }
      else if (e.key === 'Backspace') { e.preventDefault(); calcInput('⌫'); }
      else if (e.key === 'Enter') { e.preventDefault(); submitTxModal(); }
      else if (e.key === 'Escape') { closeModal(); }
    }

    function updateSplitSummary() {
      const el = document.getElementById('splitRemainingText');
      if (!el || !txModalState?.splitMode) return;
      const total = evalCalcExpr(txModalState.expr);
      const sum = txModalState.splits.reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const diff = Math.round((total - sum) * 100) / 100;
      const acc = state.accounts.find(a => a.id === txModalState.accountId);
      const cur = acc?.currency || state.settings.baseCurrency;
      if (Math.abs(diff) < 0.01 && total > 0) {
        el.innerHTML = `<span style="color:var(--income);font-weight:700;">Всё распределено ✓</span>`;
      } else {
        el.innerHTML = `<span style="color:${diff < 0 ? 'var(--danger)' : 'var(--transfer)'};font-weight:700;">${diff >= 0 ? 'Осталось распределить' : 'Превышение'}: ${formatMoney(Math.abs(diff), cur)}</span>`;
      }
    }

    function updateCalcDisplay() {
      const exprEl = document.getElementById('calcExprDisplay');
      const amtEl = document.getElementById('calcAmountDisplay');
      if (!exprEl || !amtEl) return;
      const hasOp = /[+\-×÷]/.test(txModalState.expr);
      exprEl.textContent = hasOp ? txModalState.expr : '';
      const val = evalCalcExpr(txModalState.expr);
      amtEl.textContent = hasOp ? `${txModalState.expr} = ${val.toLocaleString('ru-RU')}` : Number(txModalState.expr || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
      updateSplitSummary();
    }

    function renderTxModal() {
      const st = txModalState;
      const acc = state.accounts.find(a => a.id === st.accountId);
      const toAcc = state.accounts.find(a => a.id === st.toAccountId);
      const curCode = acc?.currency || state.settings.baseCurrency;
      const curSym = CURRENCIES[curCode]?.symbol || '₽';
      const cats = state.categories.filter(c => c.type === (st.type === 'income' ? 'income' : 'expense'));
      if (!cats.some(c => c.id === st.categoryId) && cats.length) st.categoryId = cats[0].id;

      const sliderIdx = st.type === 'expense' ? 0 : (st.type === 'income' ? 1 : 2);
      const todayStr = isoDate(new Date());
      const yest = new Date(); yest.setDate(yest.getDate() - 1);
      const yestStr = isoDate(yest);
      const crossCur = st.type === 'transfer' && acc && toAcc && acc.currency !== toAcc.currency;
      const templates = (state.templates || []).filter(t => st.type === 'transfer' ? false : t.type === st.type);
      const allKnownTags = getAllTags().filter(tg => !st.tags.includes(tg)).slice(0, 6);

      modalBox.innerHTML = `
        <div class="modal-header">
          <h3 class="modal-title">${st.editId ? 'Редактировать операцию' : 'Новая операция'}</h3>
          <button class="icon-btn" id="btnCloseModal">✕</button>
        </div>

        <div class="seg-toggle" style="width:100%;margin-bottom:12px;">

          <button class="seg-btn ${st.type==='expense'?'active':''}" data-txtype="expense">Расход</button>
          <button class="seg-btn ${st.type==='income'?'active':''}" data-txtype="income">Доход</button>
          <button class="seg-btn ${st.type==='transfer'?'active':''}" data-txtype="transfer">Перевод</button>
        </div>

        ${!st.editId && templates.length ? `
          <div class="preset-strip" id="presetStrip">
            ${templates.map(tp => {
              const tpAcc = state.accounts.find(a => a.id === tp.accountId) || acc;
              return `
                <div class="preset-chip" data-use-tpl="${tp.id}">

    function submitTxModal() {
      const st = txModalState;
      let amount = evalCalcExpr(st.expr);
      let validSplits = undefined;

      if (st.splitMode && st.type !== 'transfer') {
        const cleanSplits = st.splits
          .map(s => ({ categoryId: s.categoryId, amount: Math.round((Number(s.amount) || 0) * 100) / 100 }))
          .filter(s => s.amount > 0);
        if (cleanSplits.length < 2) {
          showToast('Для разделения чека укажите суммы минимум в 2 строках');
          return;
        }
        const splitSum = Math.round(cleanSplits.reduce((s, r) => s + r.amount, 0) * 100) / 100;
        if (amount <= 0) amount = splitSum;
        else if (Math.abs(amount - splitSum) > 0.05) {
          showToast('Сумма строк разделения должна совпадать с общей суммой чека');
          return;
        }
        validSplits = cleanSplits;
      }

      if (amount <= 0) {
        showToast('Введите сумму больше 0');
        return;
      }
      if (st.type === 'transfer' && (!st.toAccountId || st.accountId === st.toAccountId)) {
        showToast('Выберите другой счёт для перевода');
        return;
      }

      let toAmount = amount;
      if (st.type === 'transfer') {
        const acc = state.accounts.find(a => a.id === st.accountId);
        const toAcc = state.accounts.find(a => a.id === st.toAccountId);
        if (acc && toAcc && acc.currency !== toAcc.currency) {
          if (Number(st.toAmount) > 0) toAmount = Number(st.toAmount);
          else {
            const rates = state.settings.rates;
            toAmount = Math.round(((amount * (rates[acc.currency] || 1)) / (rates[toAcc.currency] || 1)) * 100) / 100;
          }
        }
      }

      const record = {
        id: st.editId || uid(),
        createdAt: st.createdAt || Date.now(),
        type: st.type,
        amount,
        accountId: st.accountId,
        toAccountId: st.type === 'transfer' ? st.toAccountId : undefined,
        toAmount: st.type === 'transfer' ? toAmount : undefined,
        categoryId: st.type === 'transfer' ? undefined : (validSplits ? validSplits[0].categoryId : st.categoryId),
        splits: validSplits,
        date: st.date,
        note: st.note.trim(),
        tags: [...st.tags]
      };

      if (st.editId) {
        const idx = state.transactions.findIndex(t => t.id === st.editId);
        if (idx !== -1) state.transactions[idx] = record;
        showToast('Операция обновлена');
      } else {
        state.transactions.unshift(record);
        if (st.makeRecurring && st.type !== 'transfer') {
          const cat = state.categories.find(c => c.id === st.categoryId);
          state.recurring.push({
            id: uid(),
            title: st.note.trim() || cat?.name || 'Платёж',
            type: st.type,
            amount,
            accountId: st.accountId,
            categoryId: st.categoryId,
            freq: st.recFreq,
            nextDate: advanceDate(st.date, st.recFreq)
          });
        }
        showToast('Операция добавлена');
      }

      saveState();
      closeModal();
      renderAll();
    }

    function advanceDate(dateStr, freq) {
      const d = new Date(dateStr + 'T00:00:00');
      if (freq === 'daily') d.setDate(d.getDate() + 1);
      else if (freq === 'weekly') d.setDate(d.getDate() + 7);
      else if (freq === 'yearly') d.setFullYear(d.getFullYear() + 1);
      else d.setMonth(d.getMonth() + 1);
      return isoDate(d);
    }

    /* ---------- SECONDARY MODALS (ACCOUNT / BUDGET / GOAL / CATEGORY / RECURRING) ---------- */
    function openAccountModal(editAcc = null) {

    function applyCurrencyChange(newCode, mode = 'convert_all') {
      const round2 = (n) => Math.round(n * 100) / 100;
      if (mode === 'convert_all') {
        const accMap = Object.fromEntries(state.accounts.map(a => [a.id, a.currency]));
        state.transactions.forEach(tx => {
          const fromCur = accMap[tx.accountId] || state.settings.baseCurrency;
          tx.amount = round2(convertAmount(tx.amount, fromCur, newCode));
          if (Array.isArray(tx.splits)) {
            tx.splits.forEach(sp => {
              sp.amount = round2(convertAmount(sp.amount, fromCur, newCode));
            });
          }
          if (tx.type === 'transfer' && tx.toAccountId) {
            const toCur = accMap[tx.toAccountId] || fromCur;
            tx.toAmount = round2(convertAmount(tx.toAmount ?? tx.amount, toCur, newCode));
          }
        });
        (state.templates || []).forEach(tp => {
          const fromCur = accMap[tp.accountId] || state.settings.baseCurrency;
          tp.amount = round2(convertAmount(tp.amount, fromCur, newCode));
        });
        state.accounts.forEach(acc => {
          acc.initialBalance = round2(convertAmount(acc.initialBalance, acc.currency, newCode));
          acc.currency = newCode;
        });
        state.recurring.forEach(r => {
          const fromCur = accMap[r.accountId] || state.settings.baseCurrency;
          r.amount = round2(convertAmount(r.amount, fromCur, newCode));
        });
        state.budgets.forEach(b => {
          b.limit = round2(convertAmount(b.limit, b.currency || 'RUB', newCode));
          b.currency = newCode;
        });
        state.goals.forEach(g => {
          g.target = round2(convertAmount(g.target, g.currency || 'RUB', newCode));
          g.saved = round2(convertAmount(g.saved, g.currency || 'RUB', newCode));
          g.currency = newCode;
        });
        (state.debts || []).forEach(d => {
          const fromCur = d.currency || accMap[d.accountId] || state.settings.baseCurrency;
          d.amount = round2(convertAmount(d.amount, fromCur, newCode));
          d.remaining = round2(convertAmount(d.remaining, fromCur, newCode));
          d.currency = newCode;
        });
      } else if (mode === 'relabel') {
        state.accounts.forEach(acc => { acc.currency = newCode; });
        state.budgets.forEach(b => { b.currency = newCode; });
        state.goals.forEach(g => { g.currency = newCode; });
        (state.debts || []).forEach(d => { d.currency = newCode; });
      }
      state.settings.baseCurrency = newCode;
      saveState();
      closeModal();
      renderAll();
      const cur = CURRENCIES[newCode];
      showToast(`Валюта изменена: ${cur.symbol} ${cur.code}`);
    }

    function openRepayDebtModal(debtId) {
      const debt = (state.debts || []).find(d => d.id === debtId);
      if (!debt) return;
      const cur = debt.currency || state.settings.baseCurrency;
      modalBox.innerHTML = `
        <div class="modal-header">

        </div>
        <div class="field-group">
          <label class="field-label">Счёт для проведения</label>
          <select class="input" id="repayAcc">
            ${state.accounts.map(a => `<option value="${a.id}" ${a.id === debt.accountId ? 'selected' : ''}>${escapeHtml(a.name)} (${a.currency})</option>`).join('')}
          </select>
        </div>
        <div class="field-group">
          <label style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer;">

      document.getElementById('btnConfirmRepay').onclick = () => {
        const pay = Number(document.getElementById('repayAmt').value);
        if (!pay || pay <= 0) return showToast('Введите сумму больше 0');
        const applied = Math.min(debt.remaining, pay);
        debt.remaining = Math.max(0, Math.round((debt.remaining - applied) * 100) / 100);
        if (debt.remaining <= 0.009) {
          debt.remaining = 0;
          debt.settled = true;
        }
        if (document.getElementById('repayCreateTx').checked) {
          const accountId = document.getElementById('repayAcc').value;
          const isIncoming = debt.direction === 'lent';
          const fallbackCat = isIncoming
            ? (state.categories.find(c => c.type === 'income')?.id)
            : (state.categories.find(c => c.type === 'expense')?.id);
          state.transactions.unshift({
            id: uid(),
            createdAt: Date.now(),
            type: isIncoming ? 'income' : 'expense',
            amount: applied,
            accountId,
            categoryId: fallbackCat,
            date: isoDate(new Date()),
            note: `${isIncoming ? 'Возврат долга от' : 'Возврат долга'}: ${debt.person}`,
            tags: ['долги']
          });
        }
        saveState(); closeModal(); renderAll();
        showToast(debt.settled ? 'Долг полностью закрыт!' : 'Частичный возврат учтён');
      };
    }

    /* ==========================================================================
       9. EXPORT CSV & JSON
       ========================================================================== */
    function exportCSV() {
      const header = ['Дата', 'Тип', 'Категория', 'Счёт', 'Сумма', 'Валюта', 'Теги', 'Заметка'];
      const typeNames = { expense: 'Расход', income: 'Доход', transfer: 'Перевод' };
      const rows = state.transactions.map(t => {
        const cat = Array.isArray(t.splits) && t.splits.length > 1
          ? t.splits.map(s => `${state.categories.find(c => c.id === s.categoryId)?.name || '?'}: ${s.amount}`).join(', ')
          : (state.categories.find(c => c.id === t.categoryId)?.name || 'Перевод');
        const acc = state.accounts.find(a => a.id === t.accountId);
        const tags = (t.tags || []).map(tg => '#' + tg).join(' ');
        return [t.date, typeNames[t.type] || t.type, cat, acc?.name || '', t.amount, acc?.currency || '', tags, t.note || '']
          .map(v => `"${String(v).replace(/"/g, '""')}"`).join(';');
      });
      const csv = '\uFEFF' + [header.join(';'), ...rows].join('\n');
      downloadFile(csv, `penny-finances-${isoDate(new Date())}.csv`, 'text/csv;charset=utf-8;');
      showToast('CSV файл выгружен');
    }

    function exportJSON() {
      downloadFile(JSON.stringify(state, null, 2), `penny-backup-${isoDate(new Date())}.json`, 'application/json');
      showToast('Резервная копия скачана');
    }

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    /* ==========================================================================
       10. EVENT BINDINGS
       ========================================================================== */
    function attachHorizontalSwipe(el, onPrev, onNext) {
      if (!el || el.dataset.swipeReady) return;
      el.dataset.swipeReady = '1';
      let sx = 0, sy = 0, tracking = false;
      el.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
        tracking = true;
      }, { passive: true });
      el.addEventListener('touchend', (e) => {
        if (!tracking) return;
        tracking = false;
        const dx = e.changedTouches[0].clientX - sx;
        const dy = e.changedTouches[0].clientY - sy;
        if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx > 0) onPrev();
          else onNext();
        }
      }, { passive: true });
    }

        });
        r.nextDate = advanceDate(r.nextDate, r.freq);
        saveState(); renderAll(); showToast(`Проведён платёж: ${r.title}`);
      });
      document.querySelectorAll('[data-del-rec]').forEach(b => b.onclick = () => {
        state.recurring = state.recurring.filter(x => x.id !== b.dataset.delRec);
        saveState(); renderAll(); showToast('Регулярный платёж удалён');
      });

      // Settings controls
      const baseCurSel = document.getElementById('setBaseCurrency');
      if (baseCurSel) baseCurSel.onchange = (e) => {
        applyCurrencyChange(e.target.value, 'display');
      };
      const openCurModalBtn = document.getElementById('btnOpenCurModalSettings');
      if (openCurModalBtn) openCurModalBtn.onclick = openCurrencyModal;
      document.querySelectorAll('[data-rate-code]').forEach(inp => {
        inp.onchange = () => {
          const val = Number(inp.value);
          if (val > 0) {
            state.settings.rates[inp.dataset.rateCode] = val;
            saveState(); renderShell();
            showToast(`Курс ${inp.dataset.rateCode} обновлён`);
          }
        };
      });
      document.querySelectorAll('[data-set-theme]').forEach(b => b.onclick = () => {
        state.settings.theme = b.dataset.setTheme;
        saveState(); renderAll();
      });
      const savePinBtn = document.getElementById('btnSavePin');
      if (savePinBtn) savePinBtn.onclick = () => {
        const val = document.getElementById('setPinInput').value.trim();
        if (!/^\d{4}$/.test(val)) return showToast('ПИН-код должен состоять из 4 цифр');
        state.settings.pinCode = val;
        saveState(); renderAll(); showToast('ПИН-код установлен');
      };
      const clearPinBtn = document.getElementById('btnClearPin');
      if (clearPinBtn) clearPinBtn.onclick = () => {
        state.settings.pinCode = null;
        saveState(); renderAll(); showToast('ПИН-код снят');
      };
      const expJsonBtn = document.getElementById('btnExportJson');
      if (expJsonBtn) expJsonBtn.onclick = exportJSON;
      const expCsv2 = document.getElementById('btnExportCsv2');
      if (expCsv2) expCsv2.onclick = exportCSV;
      const impJson = document.getElementById('importJsonInput');
      if (impJson) impJson.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (!data.accounts || !data.transactions) throw new Error('bad format');
            state = migrateState(data);
            saveState(); renderAll(); showToast('Данные успешно восстановлены');
          } catch { showToast('Ошибка чтения файла резервной копии'); }
        };
        reader.readAsText(file);
      };
      const restoreDemoBtn = document.getElementById('btnRestoreDemo');
      if (restoreDemoBtn) restoreDemoBtn.onclick = () => {
        state = buildSeedState();
        saveState(); renderAll(); showToast('Демо-данные восстановлены');
      };
      const wipeBtn = document.getElementById('btnWipeAll');
      if (wipeBtn) wipeBtn.onclick = () => {
        if (!confirm('Удалить все операции, бюджеты и цели? Счета будут обнулены.')) return;
        state.isDemo = false;
        state.transactions = [];
        state.budgets = [];
        state.goals = [];
        state.recurring = [];
        state.debts = [];
        state.accounts.forEach(a => a.initialBalance = 0);
        saveState(); renderAll(); showToast('Все данные очищены');
      };
      const addCatBtn = document.getElementById('btnAddCategory');
      if (addCatBtn) addCatBtn.onclick = () => openCategoryModal(null);
      document.querySelectorAll('[data-edit-cat]').forEach(b => b.onclick = () => {
        const cat = state.categories.find(c => c.id === b.dataset.editCat);
        if (cat) openCategoryModal(cat);
      });
      document.querySelectorAll('[data-del-cat]').forEach(b => b.onclick = () => {
        if (state.categories.length <= 2) return showToast('Должна остаться хотя бы одна категория');
        state.categories = state.categories.filter(c => c.id !== b.dataset.delCat);
        saveState(); renderAll(); showToast('Категория удалена');
      });
    }

    // Boot
    bindGlobalEvents();
    renderAll();
    if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  })();
  </script>
</body>
</html>
